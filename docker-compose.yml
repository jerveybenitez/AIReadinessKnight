# Optional local Postgres for development.
#
# The app itself runs on the host with `pnpm dev` (see README). This compose file exists only so
# you don't have to install Postgres system-wide:
#
#   docker compose up -d      # Postgres on 127.0.0.1:5432
#
# Then set in .env:
#   DATABASE_URL=postgres://payload:payload@127.0.0.1:5432/ai_ready_knight
#
# The app uses @payloadcms/db-postgres only — there is no Mongo service.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: ai_ready_knight
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d ai_ready_knight']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
